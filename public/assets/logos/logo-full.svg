<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <!-- 3D Isometric Leaf with Checkmark -->
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a47;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d8b5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a472a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Leaf top face (dark green) -->
  <path d="M 256 180 L 320 220 L 320 320 L 256 360 Z" fill="#2d6a47" />
  <!-- Leaf right face (medium green) -->
  <path d="M 320 220 L 380 260 L 380 360 L 320 320 Z" fill="#3d8b5c" />
  <!-- Leaf left face (darker green) -->
  <path d="M 256 180 L 196 220 L 196 320 L 256 360 Z" fill="#1a472a" />
  <!-- Leaf stem -->
  <path d="M 256 360 L 240 420 L 260 425 L 275 365 Z" fill="#1a472a" />
  <!-- White checkmark -->
  <g stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 240 280 L 280 320" />
    <path d="M 280 320 L 340 240" />
  </g>
</svg>
